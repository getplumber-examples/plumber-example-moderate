name: Plumber

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege: read the repo, write SARIF to code scanning.
# id-token is for publishing the live Plumber Score badge (default branch only).
permissions:
  contents: read
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.3
        with:
          persist-credentials: false
      - uses: getplumber/plumber@cbb9172b5d8ad6de6002c1e8dfee749c9f90e970 # v0.4.13
        with:
          # This repo intentionally carries a realistic spread of findings
          # (target grade C). Surface them (SARIF + report) without hard-failing
          # CI on the known gap.
          soft-fail: true
          # Publish the live C badge to score.getplumber.io (default branch only).
          score-push: true
